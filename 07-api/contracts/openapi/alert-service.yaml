openapi: 3.1.0
info:
  title: Energy Monitor Alert API
  description: 'Alerts of a home: list, read and delete. The service raises them from the readings and the device events (threshold, unusual consumption, limit, connectivity, linked device). The bearer token is issued by the security service.


    Written from the controllers and DTOs of the service at commit `0e65430` (branch `main`, 28-Oct-2026); the code is the source of truth, so regenerate or review this file when an endpoint changes. The other contracts of this folder were generated from the springdoc output (`/v3/api-docs`).


    Clients call these paths through `en-monitor-api-gateway`, which validates the access token first; the service validates it again. Error bodies carry the failure text in `message` or `error` (the home service and the gateway use the full `{timestamp, status, error, message, path}` shape; the alert, recommendation and notification services answer with a small `{error}` body in some cases).


    Internal endpoints (`/internal/**`) are not part of this contract: they are only reachable inside the Docker network with `X-Internal-Token` (see `07-api/README.md`).'
  version: v1
servers:
- url: https://energy-monitor.tech
  description: Production, through the API gateway
- url: http://localhost:8080
  description: Development, through the API gateway
- url: http://localhost:8088
  description: Development mode, the service directly
security:
- bearerAuth: []
paths:
  /api/v1/alerts:
    get:
      tags:
      - alert-controller
      operationId: list
      summary: Alerts of a home (members only)
      parameters:
      - name: homeId
        in: query
        required: true
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - RESOLVED
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertResponse'
        '404':
          description: Not a member of the home
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
      - alert-controller
      operationId: deleteResolved
      summary: Deletes every RESOLVED alert of a home
      parameters:
      - name: homeId
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
        '404':
          description: Not a member of the home
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/alerts/{idAlert}:
    get:
      tags:
      - alert-controller
      operationId: get
      summary: One alert
      parameters:
      - name: idAlert
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '404':
          description: Not found or not a member of its home
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
      - alert-controller
      operationId: delete
      summary: Deletes a resolved alert
      parameters:
      - name: idAlert
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content
        '404':
          description: Not found or not a member of its home
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The alert is still PENDING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/alerts/{idAlert}/read:
    put:
      tags:
      - alert-controller
      operationId: markRead
      summary: Marks an alert as read (it becomes RESOLVED)
      parameters:
      - name: idAlert
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '404':
          description: Not found or not a member of its home
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: System alert that resolves itself (CONNECTIVITY, or the THRESHOLD alert of the power)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    AlertResponse:
      type: object
      properties:
        idAlert:
          type: string
        homeId:
          type: string
        deviceId:
          type: string
        type:
          type: string
          enum:
          - THRESHOLD
          - CONNECTIVITY
          - DEVICE
          - LIMIT
        messageKey:
          type: string
          description: 'Key of the text the client translates: alert.threshold.high, alert.threshold.critical, alert.anomaly.device (unusual consumption, type THRESHOLD), alert.limit.daily, alert.limit.monthly and the connectivity and device keys'
        dateTime:
          type: string
          format: date-time
        alertStatus:
          type: string
          enum:
          - PENDING
          - RESOLVED
        consumptionLevelId:
          type: string
        measurementId:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
